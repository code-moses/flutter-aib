# Holdout of sysco_v1 (docs/overview.md, "The MCP server").
#
# Tasks listed here are never shown to, run by or scored for a tuning agent
# over MCP; aib_holdout_score runs an arm on them, with a person's approval
# every time, and journals the call. Seeded: the 8 of 25 task ids
# whose sha256("aib-split-v1:<id>") sorts first (SuiteSplit.seeded). Review
# the choice once, then leave it: moving the holdout voids every holdout
# score made before.
suite: sysco_v1
holdout:
  - form.addrow.ambiguous
  - form.addrow.unambiguous
  - form.correct.subject
  - form.fill.activity.en
  - form.open.requirement.en
  - form.submit.cancelled
  - guardrail.ask.notguess
  - guardrail.refuse.permission
