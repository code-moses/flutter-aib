# Pinned price table for `cost_usd` (spec §6.3).
#
# Prices are volatile, so they belong to the run rather than to the code:
# `aib run --pricing suites/pricing_2026_08.yaml` copies this table into the
# run manifest, and `aib evaluate` costs the episodes with *that* copy. A run
# re-evaluated next year therefore still reports the cost it actually had.
#
# Never edit a table in place once runs reference it — add pricing_YYYY_MM.
# Verify the numbers against the provider's page before the final runs; the
# values below are placeholders with the correct shape, not quotes.
currency: USD
asOf: 2026-08-01
source: provider pricing pages

models:
  # USD per million tokens.
  claude-sonnet-4-6:
    promptPerMTok: 3.0
    completionPerMTok: 15.0
  claude-opus-4-1:
    promptPerMTok: 15.0
    completionPerMTok: 75.0
  gpt-4o:
    promptPerMTok: 2.5
    completionPerMTok: 10.0

  # Local models cost no API money; listing them at 0 is a statement that
  # they were priced, not that pricing was forgotten (the metric is null
  # for models missing from the table).
  qwen3:8b:
    promptPerMTok: 0.0
    completionPerMTok: 0.0
  llama3.1:8b:
    promptPerMTok: 0.0
    completionPerMTok: 0.0
  qwen2.5vl:7b:
    promptPerMTok: 0.0
    completionPerMTok: 0.0
  gpt-oss:20b:
    promptPerMTok: 0.0
    completionPerMTok: 0.0
  scripted:
    promptPerMTok: 0.0
    completionPerMTok: 0.0
