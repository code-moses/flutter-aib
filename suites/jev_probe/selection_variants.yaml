# Tool-selection prompts for packages/aib_mcp/bin/jev_probe.dart.
#
# Each variant is one noul per catalogue intent: `statement` with {id} and
# {description}, optional rubric ends `ifTrue`/`ifFalse`, and `state`, how the
# task is shown to the decision model ({task}). A text is a string (every
# language) or a map of language to string; a task in a language a map lacks
# gets the English text. `candidate` is what the model reads about an intent
# (summary | summaryAliases | summaryAliasesKind). An id alone names a built-in
# JevSelectionPrompt.
variants:
  # What every jev arm ran until 2026-10-15.
  - id: needed_v1

  - id: needed_v1
    candidate: summaryAliasesKind

  # "Would call" instead of "needed": an agent calls lookups it does not
  # strictly need, and a prefilter that drops them costs a turn.
  - id: call_v1
    statement:
      en: 'To carry out the request, an assistant would call the tool {id} at some point. Tool {id}: {description}'
      de: 'Um die Anfrage zu erledigen, würde ein Assistent das Werkzeug {id} irgendwann aufrufen. Werkzeug {id}: {description}'

  - id: call_rubric_v1
    statement:
      en: 'To carry out the request, an assistant would call the tool {id} at some point. Tool {id}: {description}'
      de: 'Um die Anfrage zu erledigen, würde ein Assistent das Werkzeug {id} irgendwann aufrufen. Werkzeug {id}: {description}'
    ifTrue:
      en: 'The tool does part of the request, shows the user what was asked for, or reads something the request needs first (an id, a list, a schema).'
      de: 'Das Werkzeug erledigt einen Teil der Anfrage, zeigt dem Nutzer das Verlangte oder liest etwas, das die Anfrage zuerst braucht (eine ID, eine Liste, ein Schema).'
    ifFalse:
      en: 'The tool is about something the request does not touch.'
      de: 'Das Werkzeug betrifft etwas, das die Anfrage nicht berührt.'

  # The same with the task framed as a user's request to an app assistant —
  # the winner of the first probe (2026-10-15), now the built-in
  # JevSelectionPrompt.callRubricStateV1.
  - id: call_rubric_state_v1

  # English rubric for every task, German ones included — best on the local
  # deciders (built-in JevSelectionPrompt.callRubricEnV1).
  - id: call_rubric_en_v1

  - id: useful_v1
    statement:
      en: 'The tool {id} is useful for this request: it does part of it, looks up something it needs, or shows the user what was asked for. {id}: {description}'
      de: 'Das Werkzeug {id} ist für diese Anfrage nützlich: es erledigt einen Teil davon, schlägt etwas nach, das sie braucht, oder zeigt dem Nutzer das Verlangte. {id}: {description}'

  - id: relevant_v1
    statement:
      en: 'The tool {id} is relevant to the request. {id}: {description}'
      de: 'Das Werkzeug {id} ist für die Anfrage relevant. {id}: {description}'
