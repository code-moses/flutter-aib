# device_gemma4_e4b_litertlm.yaml with only `agent.toolSurface: full` changed.
llm:
  provider: litertlm
  model: gemma-4-E4B-it.litertlm
  contextTokens: 16384

agent:
  maxCompletionTokens: 1024
  parallelToolCalls: false
  observationWindow: 8
  toolSurface: full

router:
  router: union
  strategies: [intents, genui, user, semantics]
  bootstrap: intents.catalog
  profile: full
