# Derived from prepared_lexical.yaml by aib_mcp on 2026-10-20 (agent:
# prepared).
#
# Hypothesis: Hybrid with lexical (BM25) preparation with gemma4:26b. Expect
# fewer tokens than the union hybrid at unchanged success.
#
# One change against prepared_lexical.yaml:
#   llm.model: "qwen3:8b" -> "gemma4:26b"
#
# agentConfigHash: 34bb1a4b370b0fc4
llm:
  provider: ollama
  model: gemma4:26b
  baseUrl: http://localhost:11434
  contextTokens: 32768
  think: false
agent:
  maxCompletionTokens: 2048
  parallelToolCalls: false
  observationWindow: 8
router:
  router: union
  strategies:
    - intents
    - genui
    - user
    - semantics
  bootstrap: intents.catalog
  profile: full
preparation:
  strategy: lexical
  prepare:
    - tools
    - discovery
  topK: 5
  minScore: 0.25
  discoveryKeys:
    - app.forms
    - app.endpoints
  queryParam: query
  budget:
    maxEnvelopes: 4
    maxBriefingBytes: 4096
  escapeHatch: true
