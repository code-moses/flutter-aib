# Derived from prepared_hybrid.yaml by aib_mcp on 2026-10-20 (agent:
# prepared).
#
# Hypothesis: Hybrid with RRF (BM25 + nomic-embed-text) preparation with
# gemma4:26b. On qwen3:8b it had the best tool recall and the worst success; a
# competent model should recover through the escape hatch, so the inversion
# should shrink.
#
# One change against prepared_hybrid.yaml:
#   llm.model: "qwen3:8b" -> "gemma4:26b"
#
# agentConfigHash: 34bb1a4b370b0fc4
llm:
  provider: ollama
  model: gemma4:26b
  baseUrl: http://localhost:11434
  contextTokens: 32768
  think: false
embedding:
  provider: ollama
  model: nomic-embed-text
agent:
  maxCompletionTokens: 2048
  parallelToolCalls: false
  observationWindow: 8
router:
  router: union
  strategies:
    - intents
    - genui
    - user
    - semantics
  bootstrap: intents.catalog
  profile: full
preparation:
  strategy: hybrid
  prepare:
    - tools
    - discovery
  topK: 5
  minScore: 0.25
  rrfK: 60
  discoveryKeys:
    - app.forms
    - app.endpoints
  queryParam: query
  budget:
    maxEnvelopes: 4
    maxBriefingBytes: 4096
  escapeHatch: true
