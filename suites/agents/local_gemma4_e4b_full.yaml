# local_gemma4_e4b.yaml with only `agent.toolSurface: full` changed: every
# intent a tool with its full schema from the first call, no describe_intents.
# Ollama half of the runtime comparison with the on-device LiteRT-LM arm.
llm:
  provider: ollama
  model: gemma4:e4b
  baseUrl: http://localhost:11434
  contextTokens: 32768
  think: false

agent:
  maxCompletionTokens: 2048
  parallelToolCalls: false
  observationWindow: 8
  toolSurface: full

router:
  router: union
  strategies: [intents, genui, user, semantics]
  bootstrap: intents.catalog
  profile: full
