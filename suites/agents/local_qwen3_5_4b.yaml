# Qwen3.5-4B (2026-02; vendor: matches the 9B on TAU2) on the default
# surface. Thinking off, as on every local arm.
llm:
  provider: ollama
  model: qwen3.5:4b
  baseUrl: http://localhost:11434
  contextTokens: 32768
