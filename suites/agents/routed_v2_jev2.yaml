# todo_v2 routing arm: the jev decider a second time, after the criteria fix.
#
# Identical to routed_v2_jev.yaml. The difference is in the code it runs
# against: with no explicit `jev.criteria`, the router now builds them from
# the two models it actually holds (JevRouteDecider.criteriaFor), instead of
# describing "a small local model (about 8B)" while the local side is
# qwen3:1.7b. The first arm sent 93 % of tasks local against an oracle that
# wanted 27 %; see docs/overview.md.
#
# Original header follows.
# todo_v2 routing arm: jev decider against a local simple-jev
#
# The four routed_v2_* files differ in exactly one key — `modelRouter.decider`
# — so the comparison moves the decider and nothing else: same preparer, same
# router, same two models, same prompt.
#
# "cloud" here is qwen3:8b, not a frontier model: this machine has no API key,
# and the experiment needs a capability *gap*, not a particular vendor. 1.7b
# against 8b is that gap, and every number below is about the router, not
# about Anthropic. Re-run with `cloud.provider: anthropic` for the real thing;
# nothing else in the file changes.
#
# Reference arms: decider `local` and `cloud`. Score with
#   aib route --local results/route-v2-local --cloud results/route-v2-cloud \
#     --routed results/route-v2-rules --routed results/route-v2-jev \
#     --metrics routing,prefetch
modelRouter:
  decider: jev
  onError: cloud
  local:
    provider: ollama
    model: qwen3:1.7b
    baseUrl: http://localhost:11434
    contextTokens: 32768
    think: false
  cloud:
    provider: ollama
    model: qwen3:8b
    baseUrl: http://localhost:11434
    contextTokens: 32768
    think: false
  jev:
    baseUrl: http://127.0.0.1:8000
    model: Qwen/Qwen3.5-4B      # ./tool/jev_server.sh
    threshold: 0.5

agent:
  maxCompletionTokens: 2048
  parallelToolCalls: false
  observationWindow: 8

router:
  router: union
  strategies: [intents, genui, user, semantics]
  bootstrap: intents.catalog
  profile: full

preparation:
  strategy: lexical
  prepare: [tools]
  topK: 5
  minScore: 0.25
  budget:
    maxEnvelopes: 4
    maxBriefingBytes: 4096
  escapeHatch: true
