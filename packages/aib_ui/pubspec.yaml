name: aib_ui
description: >-
  AI Interaction Benchmark — a local web front end over Layer 4: browse any
  folder of runs, read traces, compare runs, edit agent configs and start
  runs. One process, no build step.
version: 1.0.0
repository: https://github.com/code-moses/flutter-aib/tree/main/packages/aib_ui
resolution: workspace

environment:
  sdk: ^3.12.0

executables:
  aib_ui: aib_ui

dependencies:
  aib_cli: ^1.0.0
  aib_core: ^1.0.0
  aib_mcp: ^1.0.0
  args: ^2.7.0
  path: ^1.9.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
