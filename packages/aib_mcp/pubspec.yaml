name: aib_mcp
description: >-
  AI Interaction Benchmark — the aib CLI over MCP (docs/overview.md):
  a fourth front end over Layer 4 that lets an agent configure, run and score
  benchmarks.
version: 1.0.0
repository: https://github.com/code-moses/flutter-aib/tree/main/packages/aib_mcp
resolution: workspace

environment:
  sdk: ^3.12.0

executables:
  server: server

dependencies:
  aib_agents: ^1.0.0
  aib_cli: ^1.0.0
  aib_core: ^1.0.0
  args: ^2.7.0
  crypto: ^3.0.6
  # Pinned exactly: the transport sits in front of the CLI and measures
  # nothing, but a breaking SDK release would still break the server.
  dart_mcp: ^0.5.2
  path: ^1.9.0
  stream_channel: ^2.1.4
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
