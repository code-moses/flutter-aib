name: aib_jev_llama
description: >-
  An in-process logit source for aib_jev: llama.cpp through llamadart's
  bundled native library, so a decision model runs inside the app with no
  server at all. dart:ffi — VM and Flutter (desktop, mobile), not web.
version: 1.0.0
repository: https://github.com/code-moses/flutter-aib/tree/main/packages/aib_jev_llama
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  aib_jev: ^1.0.0
  # The model store: SHA-256 over the downloaded bytes, and the download.
  crypto: ^3.0.0
  ffi: ^2.1.0
  http: ^1.2.0
  # Pinned exactly: this package calls llama.cpp through llamadart's
  # generated bindings (`src/backends/llama_cpp/bindings.dart`), which are
  # not its public API. llamadart does not expose logits (checked in 0.8.24);
  # its build hook, prebuilt binaries and bindings are what is reused. A
  # version bump is a deliberate change, re-verified by the live test.
  llamadart: ^0.8.24

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
